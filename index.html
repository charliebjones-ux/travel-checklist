<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Checklist">
<title>Travel Checklist</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f0e0d;
    font-family: Georgia, 'Times New Roman', serif;
    color: #e8e0d5;
    padding-bottom: 96px;
    -webkit-tap-highlight-color: transparent;
  }
  .header {
    border-bottom: 1px solid #2a2520;
    padding: max(32px, env(safe-area-inset-top)) 24px 20px;
    position: sticky;
    top: 0;
    background: #0f0e0d;
    z-index: 10;
  }
  .header-inner { max-width: 520px; margin: 0 auto; }
  .eyebrow-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: #7a6f65; text-transform: uppercase; font-family: monospace; }
  .save-status { font-size: 10px; font-family: monospace; letter-spacing: 0.1em; color: #3a3028; transition: color 0.3s; }
  .save-status.saved { color: #7ec87e; }
  .save-status.error { color: #e87e7e; }
  h1 {
    font-size: 26px; font-weight: 700; margin: 4px 0 14px;
    cursor: text; letter-spacing: -0.02em; color: #f0ebe3;
    border: none; background: transparent; padding: 0;
  }
  h1:focus { outline: none; border-bottom: 1px solid #c8a96e; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 4px; background: #2a2520; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #c8a96e; border-radius: 2px; transition: width 0.3s ease; }
  .progress-fill.done { background: #7ec87e; }
  .progress-label { font-size: 13px; color: #9a8f85; font-family: monospace; min-width: 70px; text-align: right; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    background: #2a2520; color: #7a6f65; border: 1px solid #3a3028; border-radius: 4px;
    padding: 5px 12px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; font-family: monospace;
  }
  .btn.accent { color: #c8a96e; }
  .btn.active { background: #c8a96e; color: #0f0e0d; border-color: #c8a96e; }
  .btn.danger { color: #e87e7e; border-color: #4a2a22; }
  .edit-panel {
    margin-top: 12px; padding: 12px; border: 1px solid #2a2520; border-radius: 6px; background: #141210;
  }
  .edit-panel p { font-size: 12px; color: #7a6f65; font-family: monospace; margin: 0 0 10px; line-height: 1.5; }
  textarea.backup {
    width: 100%; min-height: 90px; background: #1a1815; border: 1px solid #3a3028; color: #e8e0d5;
    font: 16px monospace; border-radius: 4px; padding: 8px; margin-top: 10px; resize: vertical;
  }
  .sections { max-width: 520px; margin: 0 auto; padding: 24px 24px 0; }
  .section-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: transparent; border: none; border-top: 1px solid #2a2520;
    padding: 14px 0; cursor: pointer; color: #e8e0d5; font: inherit;
  }
  .section-left { display: flex; align-items: center; gap: 10px; }
  .section-icon { font-size: 18px; }
  .section-label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-family: monospace; font-weight: 600; color: #c8a96e; }
  .section-label.done { color: #7a9a7a; }
  .section-right { display: flex; align-items: center; gap: 10px; }
  .section-count { font-size: 12px; color: #5a5048; font-family: monospace; }
  .chevron { font-size: 12px; color: #5a5048; transition: transform 0.2s; display: inline-block; }
  .chevron.collapsed { transform: rotate(-90deg); }
  .item-list { padding-bottom: 8px; }
  .item-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 4px;
    cursor: pointer; border-radius: 4px;
  }
  .checkbox {
    width: 18px; height: 18px; border-radius: 3px; border: 1.5px solid #4a4035;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .checkbox.checked { background: #c8a96e; border: none; }
  .item-label { font-size: 15px; color: #c8bfb5; user-select: none; -webkit-user-select: none; transition: all 0.15s; }
  .item-label.checked { color: #4a4035; text-decoration: line-through; }
  .edit-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .edit-input {
    flex: 1; min-width: 0; background: #1a1815; border: 1px solid #3a3028; border-radius: 4px;
    color: #e8e0d5; font: 16px Georgia, 'Times New Roman', serif; padding: 7px 9px;
  }
  .edit-input:focus { outline: none; border-color: #c8a96e; }
  .del-btn {
    background: none; border: 1px solid #4a2a22; color: #e87e7e; border-radius: 4px;
    width: 36px; height: 36px; font-size: 18px; line-height: 1; flex-shrink: 0; cursor: pointer;
  }
  .add-form { display: flex; gap: 8px; padding: 8px 0 4px; }
  .add-btn {
    background: #2a2520; border: 1px solid #3a3028; color: #c8a96e; border-radius: 4px;
    padding: 0 12px; height: 36px; font-family: monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; flex-shrink: 0;
  }
  .section-edit {
    display: flex; align-items: center; gap: 8px; padding: 14px 0 8px; border-top: 1px solid #2a2520;
  }
  .icon-input { flex: 0 0 52px; text-align: center; font-size: 20px; padding: 5px 0; }
  .section-name-input {
    color: #c8a96e; font: 600 16px monospace; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .new-section { border-top: 1px solid #2a2520; padding: 14px 0 0; margin-top: 6px; }
  .new-section-label {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-family: monospace; color: #7a6f65;
  }
  .all-packed {
    margin-top: 24px; padding: 16px 20px; background: #1a2a1a; border-radius: 8px;
    border: 1px solid #3a6a3a; text-align: center; color: #7ec87e; font-size: 14px;
    letter-spacing: 0.05em; font-family: monospace;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: #2a2520; border: 1px solid #3a3028; color: #e8e0d5;
    padding: 10px 14px; border-radius: 6px; font-family: monospace; font-size: 12px;
    display: none; gap: 14px; align-items: center; z-index: 20; max-width: calc(100% - 32px);
  }
  .toast.show { display: flex; }
  .toast button {
    background: none; border: none; color: #c8a96e; font-family: monospace; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; padding: 0; flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="eyebrow-row">
      <span class="eyebrow">TRAVEL CHECKLIST</span>
      <span class="save-status" id="saveStatus">●</span>
    </div>
    <h1 id="tripName" contenteditable="true" spellcheck="false"></h1>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0/0 · 0%</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="checkAllBtn">Check all</button>
      <button class="btn accent" id="editBtn">Edit list</button>
    </div>
  </div>
</div>

<div style="padding:0 24px">
    <div class="edit-panel" id="editPanel" hidden style="max-width:520px;margin:16px auto 0;">
      <p>Edit mode: type over any item or category name (or icon) to change it, × removes, add items at the bottom of each section and new categories at the very bottom. Tap Done when finished.</p>
      <div class="btn-row" style="margin-top:0">
        <button class="btn accent" id="exportBtn">Copy backup</button>
        <button class="btn accent" id="importBtn">Import backup</button>
        <button class="btn danger" id="restoreBtn">Restore defaults</button>
      </div>
      <div id="importArea" hidden>
        <textarea class="backup" id="importText" placeholder="Paste a backup here"></textarea>
        <div class="btn-row">
          <button class="btn accent" id="importApplyBtn">Apply backup</button>
          <button class="btn" id="importCancelBtn">Cancel</button>
        </div>
      </div>
    </div>
</div>
<div class="sections" id="sections"></div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
// Default list. Edits made on the phone are stored as an overlay (added /
// removed / renamed) on top of this, so a future update to the defaults
// still shows up without wiping anyone's edits.
const DEFAULT_SECTIONS = [
  { id: "hygiene", label: "Personal Hygiene", icon: "🧴", items: [
    { id: "toothbrush", label: "Toothbrush and Case" },
    { id: "floss", label: "Floss" },
    { id: "aquaphor", label: "Aquaphor" },
    { id: "sunscreen", label: "Sunscreen" },
    { id: "bidet", label: "Bidet" },
    { id: "razor", label: "Razor" },
    { id: "shaver", label: "Shaver (if 3+ days)" },
    { id: "soap", label: "Soap in a bag" },
    { id: "neilmed", label: "Neil Med and Packets" },
    { id: "allermi", label: "Allermi" },
    { id: "beenose", label: "Bee nose" },
    { id: "inhalers", label: "Inhalers" },
    { id: "allmeds", label: "All Meds" },
    { id: "teeth", label: "Teeth" },
    { id: "dewrinkle", label: "Dewrinkle Juice" },
  ]},
  { id: "refill", label: "Refill Bottles", icon: "🫙", items: [
    { id: "facespritz", label: "Face spritz" },
    { id: "facemoisturizer", label: "Face moisturizer" },
    { id: "facecleanser", label: "Face cleanser" },
    { id: "saltysea", label: "Salty sea spray" },
    { id: "hairgro", label: "Hair Gro" },
    { id: "shampoo", label: "Shampoo" },
    { id: "conditioner", label: "Conditioner" },
    { id: "lotion", label: "Lotion" },
    { id: "handlotion", label: "Hand lotion" },
    { id: "toothpaste", label: "Toothpaste" },
    { id: "bronners", label: "Bronners" },
  ]},
  { id: "clothing", label: "Clothing", icon: "👕", items: [
    { id: "dressshirts", label: "Dress shirts" },
    { id: "nicepants", label: "Nice pants" },
    { id: "jeans", label: "Jeans" },
    { id: "boxers", label: "Boxers" },
    { id: "socks", label: "Socks" },
    { id: "undershirts", label: "Undershirts (work)" },
    { id: "shorts", label: "Shorts" },
    { id: "swim", label: "Swim" },
    { id: "workout", label: "Workout wear" },
    { id: "exercisebands", label: "Exercise bands" },
    { id: "jacket", label: "Jacket" },
    { id: "nuvation", label: "Nuvation vest" },
    { id: "dirtybag", label: "Dirty clothes bag" },
    { id: "yogamat", label: "Yoga mat" },
  ]},
  { id: "footwear", label: "Footwear", icon: "👟", items: [
    { id: "running", label: "Running and workout" },
    { id: "workshoes", label: "Work shoes" },
    { id: "blundstones", label: "Blundstones" },
    { id: "flipflops", label: "Flip flops" },
  ]},
  { id: "workbag", label: "Work Bag Contents", icon: "💼", items: [
    { id: "computer", label: "Computer" },
    { id: "ipad", label: "iPad" },
    { id: "earbuds", label: "Ear buds" },
    { id: "chargingbag", label: "Charging bag" },
    { id: "lenswipes", label: "Lens wipes" },
    { id: "shitkit", label: "Shit kit" },
    { id: "antibacterial", label: "Antibacterial wipes" },
  ]},
  { id: "misc", label: "Misc", icon: "✨", items: [
    { id: "tea", label: "Tea and monkeyfruit" },
    { id: "mints", label: "Mints" },
    { id: "speaker", label: "Speaker" },
    { id: "sunglasses", label: "Sunglasses" },
    { id: "lenscleaners", label: "Lens cleaners" },
    { id: "hat", label: "Hat" },
    { id: "coldshower", label: "Cold shower" },
    { id: "tinybackpack", label: "Tiny backpack" },
    { id: "steamer", label: "Steamer" },
    { id: "nic", label: "Nic" },
  ]},
];
const STORAGE_KEY = "work-travel-checklist-v1";
const DEFAULT_TRIP = "Work Trip";

function emptyEdits() {
  return { added: [], removed: {}, renamed: {}, addedSections: [], sectionRemoved: {}, sectionRenamed: {} };
}
const DEFAULT_ICON = "📦";

let state = { checked: {}, tripName: DEFAULT_TRIP, collapsed: {}, edits: emptyEdits() };
let editMode = false;
let lastUndo = null;
let refocusSection = null;
let toastTimer = null;

function normalizeEdits(e) {
  e = e && typeof e === "object" ? e : {};
  return {
    added: Array.isArray(e.added)
      ? e.added.filter(a => a && typeof a.id === "string" && typeof a.section === "string" && typeof a.label === "string")
      : [],
    removed: e.removed && typeof e.removed === "object" ? e.removed : {},
    renamed: e.renamed && typeof e.renamed === "object" ? e.renamed : {},
    addedSections: Array.isArray(e.addedSections)
      ? e.addedSections.filter(s => s && typeof s.id === "string" && typeof s.label === "string")
      : [],
    sectionRemoved: e.sectionRemoved && typeof e.sectionRemoved === "object" ? e.sectionRemoved : {},
    sectionRenamed: e.sectionRenamed && typeof e.sectionRenamed === "object" ? e.sectionRenamed : {},
  };
}

function getSections() {
  const e = state.edits;
  const defs = DEFAULT_SECTIONS.map(s => ({ id: s.id, label: s.label, icon: s.icon, items: s.items, custom: false }));
  const extra = e.addedSections.map(s => ({ id: s.id, label: s.label, icon: s.icon || DEFAULT_ICON, items: [], custom: true }));
  return defs.concat(extra).filter(s => !e.sectionRemoved[s.id]).map(s => {
    const o = e.sectionRenamed[s.id] || {};
    const base = s.items.filter(i => !e.removed[i.id]).map(i => ({ id: i.id, label: e.renamed[i.id] || i.label, custom: false }));
    const custom = e.added.filter(a => a.section === s.id).map(a => ({ id: a.id, label: e.renamed[a.id] || a.label, custom: true }));
    return { id: s.id, label: o.label || s.label, icon: o.icon || s.icon, custom: s.custom, items: base.concat(custom) };
  });
}

function sectionDefaults(id) {
  const d = DEFAULT_SECTIONS.find(s => s.id === id);
  if (d) return { label: d.label, icon: d.icon };
  const a = state.edits.addedSections.find(s => s.id === id);
  return a ? { label: a.label, icon: a.icon || DEFAULT_ICON } : null;
}
function allItems() { return getSections().flatMap(s => s.items); }

// ---- Persistence ----
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.checked = p.checked && typeof p.checked === "object" ? p.checked : {};
      state.tripName = typeof p.tripName === "string" && p.tripName ? p.tripName : DEFAULT_TRIP;
      state.collapsed = p.collapsed && typeof p.collapsed === "object" ? p.collapsed : {};
      state.edits = normalizeEdits(p.edits);
    }
    setSaveStatus("idle");
  } catch (err) {
    setSaveStatus("error");
    console.error("load failed", err);
  }
}

let saveTimer = null;
function save() {
  setSaveStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus("idle"), 1500);
    } catch (err) {
      setSaveStatus("error");
      console.error("save failed", err);
    }
  }, 250);
}
// Flush a pending save if the app is backgrounded mid-debounce
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && saveTimer) {
    clearTimeout(saveTimer);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
  }
});

function setSaveStatus(status) {
  const el = document.getElementById("saveStatus");
  el.className = "save-status" + (status === "saved" ? " saved" : status === "error" ? " error" : "");
  el.textContent = status === "saved" ? "✓ SAVED" : status === "error" ? "⚠ SAVE FAILED" : status === "saving" ? "SAVING…" : "●";
}

// ---- Toast with optional undo ----
function showToast(msg, withUndo) {
  document.getElementById("toastMsg").textContent = msg;
  document.getElementById("toastUndo").hidden = !withUndo;
  document.getElementById("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, withUndo ? 6000 : 2500);
}
function hideToast() {
  document.getElementById("toast").classList.remove("show");
  if (!document.getElementById("toastUndo").hidden) lastUndo = null;
}
document.getElementById("toastUndo").onclick = () => {
  if (lastUndo) { lastUndo(); lastUndo = null; save(); render(); }
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
};

// ---- Edit operations ----
function newId() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function addItem(sectionId, label) {
  const v = label.trim();
  if (!v) return;
  state.edits.added.push({ id: newId(), section: sectionId, label: v });
  refocusSection = sectionId;
  save();
  render();
}

function renameItem(item, value) {
  const v = value.trim();
  const e = state.edits;
  if (!v) return false;
  let def = null;
  if (item.custom) {
    const a = e.added.find(x => x.id === item.id);
    def = a ? a.label : null;
  } else {
    for (const s of DEFAULT_SECTIONS) { const d = s.items.find(i => i.id === item.id); if (d) { def = d.label; break; } }
  }
  if (v === def) delete e.renamed[item.id]; else e.renamed[item.id] = v;
  item.label = v;
  save();
  return true;
}

function deleteItem(item) {
  const e = state.edits;
  if (item.custom) {
    const idx = e.added.findIndex(a => a.id === item.id);
    if (idx < 0) return;
    const rec = e.added[idx];
    e.added.splice(idx, 1);
    lastUndo = () => { state.edits.added.splice(Math.min(idx, state.edits.added.length), 0, rec); };
  } else {
    e.removed[item.id] = true;
    lastUndo = () => { delete state.edits.removed[item.id]; };
  }
  save();
  render();
  showToast(`Removed “${item.label}”`, true);
}

function addSection(label, icon) {
  const v = label.trim();
  if (!v) return false;
  const id = newId();
  state.edits.addedSections.push({ id, label: v, icon: icon.trim() || DEFAULT_ICON });
  refocusSection = id; // jump straight to adding its first item
  save();
  render();
  return true;
}

// field is "label" or "icon". Like item renames, no re-render here.
function editSection(sectionId, field, value) {
  const v = value.trim();
  if (field === "label" && !v) return false;
  const e = state.edits;
  const def = sectionDefaults(sectionId);
  if (!def) return false;
  const custom = e.addedSections.find(s => s.id === sectionId);
  if (custom) {
    custom[field] = v || DEFAULT_ICON;
  } else {
    const o = Object.assign({}, e.sectionRenamed[sectionId]);
    if (!v || v === def[field]) delete o[field]; else o[field] = v;
    if (Object.keys(o).length) e.sectionRenamed[sectionId] = o; else delete e.sectionRenamed[sectionId];
  }
  save();
  return true;
}

function deleteSection(section) {
  const n = section.items.length;
  if (n && !confirm(`Delete “${section.label}” and its ${n} item${n === 1 ? "" : "s"}?`)) return;
  const e = state.edits;
  if (section.custom) {
    const idx = e.addedSections.findIndex(s => s.id === section.id);
    if (idx < 0) return;
    const rec = e.addedSections[idx];
    e.addedSections.splice(idx, 1);
    // Its items stay in storage (hidden) so Undo brings them back intact.
    lastUndo = () => { state.edits.addedSections.splice(Math.min(idx, state.edits.addedSections.length), 0, rec); };
  } else {
    e.sectionRemoved[section.id] = true;
    lastUndo = () => { delete state.edits.sectionRemoved[section.id]; };
  }
  save();
  render();
  showToast(`Removed “${section.label}”`, true);
}

// ---- Render ----
function el(tag, props, children) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "text") n.textContent = props[k];
    else if (k.startsWith("on")) n[k] = props[k];
    else n.setAttribute(k, props[k]);
  }
  (children || []).forEach(c => c && n.appendChild(c));
  return n;
}

function checkSvg() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", "10"); svg.setAttribute("height", "8"); svg.setAttribute("viewBox", "0 0 10 8"); svg.setAttribute("fill", "none");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", "M1 4L3.5 6.5L9 1"); p.setAttribute("stroke", "#0f0e0d"); p.setAttribute("stroke-width", "1.8");
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  svg.appendChild(p);
  return svg;
}

function sectionEditHeader(section) {
  const iconIn = el("input", { class: "edit-input icon-input", type: "text", "aria-label": "Category icon for " + section.label });
  iconIn.value = section.icon;
  iconIn.onchange = () => { editSection(section.id, "icon", iconIn.value); if (!iconIn.value.trim()) iconIn.value = sectionDefaults(section.id).icon; };
  const nameIn = el("input", { class: "edit-input section-name-input", type: "text", enterkeyhint: "done", "aria-label": "Category name" });
  nameIn.value = section.label;
  nameIn.onchange = () => { if (!editSection(section.id, "label", nameIn.value)) nameIn.value = section.label; };
  [iconIn, nameIn].forEach(i => i.onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); i.blur(); } });
  const del = el("button", { class: "del-btn", "aria-label": "Remove category " + section.label, text: "×", onclick: () => deleteSection(section) });
  return el("div", { class: "section-edit" }, [iconIn, nameIn, del]);
}

function render() {
  const sections = getSections();
  const items = sections.flatMap(s => s.items);
  const totalChecked = items.filter(i => state.checked[i.id]).length;
  const totalItems = items.length;
  const pct = totalItems ? Math.round((totalChecked / totalItems) * 100) : 0;

  const title = document.getElementById("tripName");
  if (document.activeElement !== title) title.textContent = state.tripName + " ✏️";
  document.getElementById("progressLabel").textContent = `${totalChecked}/${totalItems} · ${pct}%`;
  const fill = document.getElementById("progressFill");
  fill.style.width = pct + "%";
  fill.className = "progress-fill" + (pct === 100 ? " done" : "");

  const editBtn = document.getElementById("editBtn");
  editBtn.textContent = editMode ? "Done" : "Edit list";
  editBtn.classList.toggle("active", editMode);
  document.getElementById("editPanel").hidden = !editMode;
  if (!editMode) document.getElementById("importArea").hidden = true;

  const container = document.getElementById("sections");
  container.replaceChildren();

  sections.forEach(section => {
    const sectionChecked = section.items.filter(i => state.checked[i.id]).length;
    // Edit mode ignores collapse so every section's add box is reachable.
    const isCollapsed = !editMode && !!state.collapsed[section.id];
    const sectionDone = section.items.length > 0 && sectionChecked === section.items.length;

    const header = editMode ? sectionEditHeader(section) : el("button", { class: "section-header", onclick: () => {
      state.collapsed[section.id] = !state.collapsed[section.id];
      save(); render();
    }}, [
      el("div", { class: "section-left" }, [
        el("span", { class: "section-icon", text: section.icon }),
        el("span", { class: "section-label" + (sectionDone ? " done" : ""), text: section.label }),
      ]),
      el("div", { class: "section-right" }, [
        el("span", { class: "section-count", text: `${sectionChecked}/${section.items.length}` }),
        el("span", { class: "chevron" + (isCollapsed ? " collapsed" : ""), text: "▾" }),
      ]),
    ]);

    const wrap = el("div", { style: "margin-bottom:6px", "data-section": section.id }, [header]);

    if (!isCollapsed) {
      const list = el("div", { class: "item-list" });
      section.items.forEach(item => {
        if (editMode) {
          const input = el("input", { class: "edit-input", type: "text", enterkeyhint: "done", "aria-label": "Item name" });
          input.value = item.label;
          // Save on change (fires on blur). No re-render here, so a tap on
          // another control during blur isn't swallowed by a DOM rebuild.
          input.onchange = () => { if (!renameItem(item, input.value)) input.value = item.label; };
          input.onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); input.blur(); } };
          const del = el("button", { class: "del-btn", "aria-label": "Remove " + item.label, text: "×", onclick: () => deleteItem(item) });
          list.appendChild(el("div", { class: "edit-row" }, [input, del]));
        } else {
          const isChecked = !!state.checked[item.id];
          const box = el("div", { class: "checkbox" + (isChecked ? " checked" : "") });
          if (isChecked) box.appendChild(checkSvg());
          const row = el("div", { class: "item-row", role: "checkbox", "aria-checked": String(isChecked), onclick: () => {
            state.checked[item.id] = !state.checked[item.id];
            save(); render();
          }}, [box, el("span", { class: "item-label" + (isChecked ? " checked" : ""), text: item.label })]);
          list.appendChild(row);
        }
      });

      if (editMode) {
        const addInput = el("input", { class: "edit-input", type: "text", placeholder: "Add item…", enterkeyhint: "done", "data-add": section.id });
        const form = el("form", { class: "add-form", onsubmit: (ev) => { ev.preventDefault(); addItem(section.id, addInput.value); } }, [
          addInput,
          el("button", { class: "add-btn", type: "submit", text: "Add" }),
        ]);
        list.appendChild(form);
      }
      wrap.appendChild(list);
    }
    container.appendChild(wrap);
  });

  if (editMode) {
    const iconIn = el("input", { class: "edit-input icon-input", type: "text", placeholder: DEFAULT_ICON, "aria-label": "New category icon", id: "newSectionIcon" });
    const nameIn = el("input", { class: "edit-input", type: "text", placeholder: "New category…", enterkeyhint: "done", "aria-label": "New category name", id: "newSectionName" });
    container.appendChild(el("div", { class: "new-section" }, [
      el("div", { class: "new-section-label", text: "Add a category" }),
      el("form", { class: "add-form", onsubmit: (ev) => { ev.preventDefault(); addSection(nameIn.value, iconIn.value); } }, [
        iconIn, nameIn, el("button", { class: "add-btn", type: "submit", text: "Add" }),
      ]),
    ]));
  }

  if (!editMode && pct === 100) container.appendChild(el("div", { class: "all-packed", text: "✓ ALL PACKED. SAFE TRAVELS." }));

  if (refocusSection) {
    const inp = container.querySelector(`input[data-add="${refocusSection}"]`);
    refocusSection = null;
    if (inp) inp.focus();
  }
}

// ---- Header controls ----
document.getElementById("resetBtn").onclick = () => { state.checked = {}; save(); render(); };
document.getElementById("checkAllBtn").onclick = () => { allItems().forEach(i => state.checked[i.id] = true); save(); render(); };
document.getElementById("editBtn").onclick = () => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  editMode = !editMode;
  render();
};

const titleEl = document.getElementById("tripName");
titleEl.addEventListener("blur", (e) => {
  state.tripName = e.target.textContent.replace("✏️", "").trim() || DEFAULT_TRIP;
  save(); render();
});
titleEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });

// ---- Backup / restore ----
function backupPayload() {
  return JSON.stringify({ v: 1, list: STORAGE_KEY, checked: state.checked, tripName: state.tripName, edits: state.edits });
}
document.getElementById("exportBtn").onclick = async () => {
  const payload = backupPayload();
  try {
    await navigator.clipboard.writeText(payload);
    showToast("Backup copied. Paste it into Notes.", false);
  } catch (err) {
    document.getElementById("importArea").hidden = false;
    const t = document.getElementById("importText");
    t.value = payload; t.focus(); t.select();
    showToast("Clipboard blocked. Copy the text shown.", false);
  }
};
document.getElementById("importBtn").onclick = () => {
  const area = document.getElementById("importArea");
  area.hidden = !area.hidden;
  if (!area.hidden) { document.getElementById("importText").value = ""; document.getElementById("importText").focus(); }
};
document.getElementById("importCancelBtn").onclick = () => { document.getElementById("importArea").hidden = true; };
document.getElementById("importApplyBtn").onclick = () => {
  let p;
  try { p = JSON.parse(document.getElementById("importText").value); } catch (err) { showToast("That isn't a valid backup.", false); return; }
  if (!p || typeof p !== "object" || (!p.edits && !p.checked)) { showToast("That isn't a valid backup.", false); return; }
  if (p.list && p.list !== STORAGE_KEY && !confirm("This backup is from the other list. Import it here anyway?")) return;
  state.checked = p.checked && typeof p.checked === "object" ? p.checked : {};
  if (typeof p.tripName === "string" && p.tripName) state.tripName = p.tripName;
  state.edits = normalizeEdits(p.edits);
  lastUndo = null;
  document.getElementById("importArea").hidden = true;
  save(); render();
  showToast("Backup restored.", false);
};
document.getElementById("restoreBtn").onclick = () => {
  if (!confirm("Restore the default list? Items you added, removed or renamed will be reset. Checkmarks are kept.")) return;
  state.edits = emptyEdits();
  lastUndo = null;
  save(); render();
  showToast("Default list restored.", false);
};

// ---- Init ----
load();
render();
</script>
</body>
</html>
